# helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f k8s/monitoring/kube-prometheus-values.yaml
prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors / PrometheusRules from every namespace
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources: { requests: { storage: 20Gi } }
grafana:
  adminPassword: "CHANGE_ME"        # or use grafana.admin.existingSecret
  service:
    type: ClusterIP                 # open with: kubectl -n monitoring port-forward svc/kube-prometheus-stack-grafana 3000:80
  # Read-only anonymous viewing. Safe here: Grafana has no public address and is only
  # reachable through `kubectl port-forward`; lets the screenshot script capture dashboards.
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources: { requests: { storage: 2Gi } }
