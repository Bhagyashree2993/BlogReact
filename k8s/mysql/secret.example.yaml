# EXAMPLE ONLY - not applied by kustomize. The Jenkins pipeline creates this
# secret from the "mysql-root-password" / "mysql-app-password" credentials.
# Manual equivalent:
#   kubectl -n blogapp create secret generic mysql-secret \
#     --from-literal=MYSQL_ROOT_PASSWORD=... --from-literal=MYSQL_USER=bloguser \
#     --from-literal=MYSQL_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: blogapp
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: REPLACE_WITH_ROOT_PASSWORD
  MYSQL_USER: bloguser
  MYSQL_PASSWORD: REPLACE_WITH_APP_PASSWORD
